name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least-privilege, but explicit: the `secrets` job needs to read pull-request
# metadata for PR scans (gitleaks-action calls the PR API). The repo default is
# read-only, which alone yields "Resource not accessible by integration", so
# `pull-requests: read` must be granted here.
permissions:
  contents: read
  pull-requests: read

# Note for future maintainers: this workflow is intentionally read-only.
# Do NOT add `docker compose up` / build / deploy steps here. This stack's ROM
# library and volumes are managed by the live homelab deployment, so an `up`
# would fail in CI. Validation only.

jobs:
  # Backstop for `git commit --no-verify`: scans full history for secrets.
  secrets:
    name: secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          # Required: a shallow clone would miss secrets in earlier commits.
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          # gitleaks-action v2 requires GITHUB_TOKEN to scan pull requests.
          # The automatic token is enough; no custom repo secret is needed.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Repo-root gitleaks.toml extends the default ruleset with a
          # Tailscale `tskey-...` rule.
          GITLEAKS_CONFIG: gitleaks.toml

  # Validates the declarative config this repo is made of.
  validate:
    name: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate compose.yaml
        env:
          # Synthetic values so ${...} interpolation resolves. Never real secrets.
          TAILSCALE_AUTH_KEY: tskey-auth-0000000000000000
          ROMM_AUTH_SECRET_KEY: ci-placeholder-not-a-real-secret
          ROMM_DB_ROOT_PASSWORD: ci-placeholder
          ROMM_DB_PASSWORD: ci-placeholder
        run: docker compose config --quiet

      - name: Validate ts-serve.json
        run: >-
          python3 -c "import json; json.load(open('ts-serve.json')); print('ts-serve.json OK')"

      - name: Check .env.example documents every compose variable
        run: |
          set -euo pipefail
          # Every ${VAR} referenced in compose.yaml must be documented in .env.example.
          # Regex must include digits: [A-Z_]* would truncate names like N8N_WEBHOOK_URL.
          referenced=$(grep -oE '\$\{[A-Z_][A-Z0-9_]*' compose.yaml | sed 's/\${//' | sort -u)
          missing=""
          for var in $referenced; do
            if ! grep -qE "^${var}=" .env.example; then
              missing="${missing} ${var}"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::compose.yaml references variables missing from .env.example:${missing}"
            exit 1
          fi
          echo "All [${referenced}] present in .env.example"
